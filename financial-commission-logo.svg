<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80">
  <g fill="none">
    <!-- Outer Ring -->
    <circle cx="40" cy="40" r="36" stroke="#0ea5e9" stroke-width="2" fill="#0f172a"/>
    <circle cx="40" cy="40" r="34" stroke="#e2e8f0" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="24" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <!-- Temple Columns & Roof -->
    <path d="M40 24 L52 30 L28 30 Z" fill="#ffffff"/>
    <rect x="29" y="31" width="22" height="2" fill="#ffffff"/>
    <rect x="31" y="34" width="2.5" height="11" fill="#ffffff"/>
    <rect x="36" y="34" width="2.5" height="11" fill="#ffffff"/>
    <rect x="41.5" y="34" width="2.5" height="11" fill="#ffffff"/>
    <rect x="46.5" y="34" width="2.5" height="11" fill="#ffffff"/>
    <rect x="29" y="46" width="22" height="2" fill="#ffffff"/>
    <!-- Curved Text simulation -->
    <path id="circleTextPath" d="M 12 40 A 28 28 0 0 1 68 40" fill="none"/>
    <text font-family="sans-serif" font-size="5" font-weight="bold" fill="#cbd5e1">
      <textPath href="#circleTextPath" startOffset="50%" text-anchor="middle">The Financial Commission</textPath>
    </text>
    <!-- Vertical Divider Line -->
    <line x1="88" y1="12" x2="88" y2="68" stroke="#94A3B8" stroke-width="2"/>
    <!-- Text on Right -->
    <text x="98" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff">The</text>
    <text x="98" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Financial</text>
    <text x="98" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Commission</text>
  </g>
</svg>
