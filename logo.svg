<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#071e16" />
      <stop offset="60%" stop-color="#03110d" />
      <stop offset="100%" stop-color="#010806" />
    </radialGradient>

    <!-- Metallic Emerald Green Gradient for Logo Body -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="85%" stop-color="#047857" />
      <stop offset="100%" stop-color="#024e37" />
    </linearGradient>

    <!-- Metallic Highlight Overlay -->
    <linearGradient id="shineOverlay" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#6ee7b7" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#34d399" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#000000" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7" />
    </linearGradient>

    <!-- Soft outer glow for logo -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#10b981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Dark Rounded Container Canvas -->
  <rect x="20" y="20" width="460" height="460" rx="100" fill="url(#bgGrad)" stroke="#0d3b2b" stroke-width="2" />

  <!-- Logo Group -->
  <g filter="url(#emeraldGlow)">
    <!-- Connected 'b' outer geometry -->
    <path d="
      M 165 110
      h 70
      a 22 22 0 0 1 22 22
      v 32
      a 22 22 0 0 0 22 22
      h 55
      a 22 22 0 0 1 22 22
      v 115
      a 22 22 0 0 1 -22 22
      h -169
      a 22 22 0 0 1 -22 -22
      v -191
      a 22 22 0 0 1 22 -22
      z
    " fill="url(#emeraldGrad)" />

    <!-- Glossy Shine Overlay -->
    <path d="
      M 165 110
      h 70
      a 22 22 0 0 1 22 22
      v 32
      a 22 22 0 0 0 22 22
      h 55
      a 22 22 0 0 1 22 22
      v 115
      a 22 22 0 0 1 -22 22
      h -169
      a 22 22 0 0 1 -22 -22
      v -191
      a 22 22 0 0 1 22 -22
      z
    " fill="url(#shineOverlay)" />

    <!-- Center Cutout Square in Lower Loop -->
    <rect x="220" y="242" width="62" height="62" rx="14" fill="#03110d" />
  </g>
</svg>
