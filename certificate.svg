    <rect x="38" y="0" width="5" height="46" fill="#000"/>
    <rect x="46" y="0" width="8" height="46" fill="#000"/>
    <rect x="57" y="0" width="3" height="46" fill="#000"/>
    <rect x="62" y="0" width="6" height="46" fill="#000"/>
    <rect x="70" y="0" width="2" height="46" fill="#000"/>
    <rect x="74" y="0" width="7" height="46" fill="#000"/>
    <rect x="83" y="0" width="4" height="46" fill="#000"/>
    <rect x="89" y="0" width="2" height="46" fill="#000"/>
    <rect x="93" y="0" width="8" height="46" fill="#000"/>
    <rect x="103" y="0" width="3" height="46" fill="#000"/>
    <rect x="108" y="0" width="6" height="46" fill="#000"/>
    <rect x="116" y="0" width="2" height="46" fill="#000"/>
    <rect x="120" y="0" width="7" height="46" fill="#000"/>
    <rect x="129" y="0" width="4" height="46" fill="#000"/>
    <rect x="135" y="0" width="2" height="46" fill="#000"/>
    <rect x="139" y="0" width="8" height="46" fill="#000"/>
    <rect x="149" y="0" width="3" height="46" fill="#000"/>
    <rect x="154" y="0" width="6" height="46" fill="#000"/>
    <rect x="162" y="0" width="2" height="46" fill="#000"/>
    <rect x="166" y="0" width="7" height="46" fill="#000"/>
    <rect x="175" y="0" width="4" height="46" fill="#000"/>
    <rect x="181" y="0" width="2" height="46" fill="#000"/>
    <rect x="185" y="0" width="8" height="46" fill="#000"/>
    <rect x="195" y="0" width="3" height="46" fill="#000"/>
    <rect x="200" y="0" width="6" height="46" fill="#000"/>
    <rect x="208" y="0" width="2" height="46" fill="#000"/>
    <rect x="212" y="0" width="7" height="46" fill="#000"/>
    <rect x="221" y="0" width="4" height="46" fill="#000"/>
    <rect x="227" y="0" width="2" height="46" fill="#000"/>
    <rect x="231" y="0" width="8" height="46" fill="#000"/>
    <rect x="241" y="0" width="3" height="46" fill="#000"/>
    <rect x="246" y="0" width="6" height="46" fill="#000"/>
    <rect x="254" y="0" width="2" height="46" fill="#000"/>
    <rect x="258" y="0" width="7" height="46" fill="#000"/>
    <rect x="267" y="0" width="4" height="46" fill="#000"/>
    <rect x="273" y="0" width="2" height="46" fill="#000"/>
    <rect x="277" y="0" width="8" height="46" fill="#000"/>

    <text x="140" y="65" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" letter-spacing="1" text-anchor="middle" fill="#000000">*N13905054K*</text>
  </g>

  <!-- Bottom Left: Companies House Official Logo -->
  <g transform="translate(90, 895)">
    <!-- Small Crest Icon -->
    <g transform="scale(0.32)">
      <path d="M 20 5 C 10 5 0 12 0 22 C 0 32 10 38 20 45 C 30 38 40 32 40 22 C 40 12 30 5 20 5 Z" fill="none" stroke="#000000" stroke-width="3"/>
      <path d="M 20 5 L 20 45 M 0 22 L 40 22" stroke="#000000" stroke-width="2"/>
    </g>
    <text x="22" y="32" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#000000">Companies House</text>
  </g>

  <!-- Bottom Right: Official Seal of the Registrar of Companies -->
  <g transform="translate(615, 870)">
    <circle cx="45" cy="40" r="38" fill="none" stroke="#000000" stroke-width="2"/>
    <circle cx="45" cy="40" r="34" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="3 2"/>
    
    <!-- Monogram CH -->
    <text x="45" y="47" font-family="'Times New Roman', serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">CH</text>
    <text x="45" y="18" font-family="Arial, sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle" fill="#000000">REGISTRAR OF COMPANIES</text>
    <text x="45" y="62" font-family="Arial, sans-serif" font-size="6" font-weight="bold" text-anchor="middle" fill="#000000">FOR ENGLAND AND WALES</text>

    <!-- Text below seal -->
    <text x="45" y="92" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#000000">THE OFFICIAL SEAL OF THE</text>
    <text x="45" y="103" font-family="Arial, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle" fill="#000000">REGISTRAR OF COMPANIES</text>
  </g>

  <!-- Footer Authenticated Statement -->
  <text x="400" y="1025" font-family="'Times New Roman', Georgia, serif" font-size="12" text-anchor="middle" fill="#000000">The above information was communicated by electronic means and authenticated by</text>
  <text x="400" y="1042" font-family="'Times New Roman', Georgia, serif" font-size="12" text-anchor="middle" fill="#000000">the Registrar of Companies under section 1115 of the Companies Act 2006</text>
