<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%" style="background-color: #ffffff;">
  <!-- Document Background -->
  <rect x="0" y="0" width="800" height="1130" fill="#ffffff"/>

  <!-- Outer Black Margin Border (Matching Companies House Scanned Document) -->
  <rect x="20" y="20" width="760" height="1090" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Header: FILE COPY -->
  <text x="400" y="72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="1.5" text-anchor="middle" fill="#000000">FILE COPY</text>

  <!-- Royal Coat of Arms Emblem (United Kingdom Government Seal) -->
  <g transform="translate(325, 102) scale(0.85)">
    <!-- Shield -->
    <path d="M 45 18 C 22 18 8 32 8 58 C 8 84 25 102 45 118 C 65 102 82 84 82 58 C 82 32 68 18 45 18 Z" fill="#ffffff" stroke="#000000" stroke-width="2.5"/>
    <!-- Garter Belt Circle -->
    <circle cx="45" cy="58" r="32" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="8 3"/>
    <path d="M 45 28 L 45 88 M 15 58 L 75 58" stroke="#000000" stroke-width="1.5"/>
    <!-- Quarter Lions / Harp details -->
    <path d="M 22 38 Q 30 32 38 42 M 22 46 Q 30 40 38 50 M 52 68 Q 60 62 68 72 M 52 76 Q 60 70 68 80" stroke="#000000" stroke-width="1.8" fill="none"/>
    
    <!-- Crown top -->
    <path d="M 22 15 L 30 4 L 45 10 L 60 4 L 68 15 L 62 20 L 28 20 Z" fill="#000000"/>
    <circle cx="45" cy="4" r="3.5" fill="#000000"/>
    <circle cx="30" cy="4" r="2" fill="#000000"/>
    <circle cx="60" cy="4" r="2" fill="#000000"/>

    <!-- Left Supporter: Royal Lion -->
    <path d="M 8 30 C -8 18 -22 30 -18 52 C -15 68 -5 78 -2 95 C 5 88 10 78 8 68 Z" fill="#000000"/>
    <path d="M -18 22 Q -12 10 -6 22 L -12 28 Z" fill="#000000"/> <!-- Lion Crown -->
    <path d="M -22 45 C -30 40 -35 55 -25 65 Z" fill="none" stroke="#000000" stroke-width="2"/>

    <!-- Right Supporter: Unicorn -->
    <path d="M 82 30 C 98 18 112 30 108 52 C 105 68 95 78 92 95 C 85 88 80 78 82 68 Z" fill="#000000"/>
    <path d="M 95 18 L 105 2 L 98 15 Z" fill="#000000"/> <!-- Horn -->
    <path d="M 102 52 Q 115 60 105 75" fill="none" stroke="#000000" stroke-width="1.8"/> <!-- Chain -->

    <!-- Motto Scroll -->
    <path d="M -25 102 C 10 118 80 118 115 102 L 110 116 C 75 130 15 130 -20 116 Z" fill="#000000"/>
    <text x="45" y="113" font-family="'Times New Roman', serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">DIEU ET MON DROIT</text>
  </g>

  <!-- Title Block -->
  <text x="400" y="278" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" letter-spacing="0.5" text-anchor="middle" fill="#000000">CERTIFICATE OF INCORPORATION</text>
  <text x="400" y="308" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#000000">OF A</text>
  <text x="400" y="342" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="bold" letter-spacing="0.5" text-anchor="middle" fill="#000000">PRIVATE LIMITED COMPANY</text>

  <!-- Company Number -->
  <text x="400" y="392" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#000000">Company Number <tspan font-weight="bold" font-size="18.5">13905054</tspan></text>

  <!-- Main Legal Declaration Body (Times New Roman / Serif as in original) -->
  <text x="400" y="468" font-family="'Times New Roman', Georgia, serif" font-size="17.5" text-anchor="middle" fill="#000000">The Registrar of Companies for England and Wales, hereby certifies</text>
  <text x="400" y="492" font-family="'Times New Roman', Georgia, serif" font-size="17.5" text-anchor="middle" fill="#000000">that</text>

  <!-- Company Name in Bold Sans-serif -->
  <text x="400" y="534" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" letter-spacing="0.2" text-anchor="middle" fill="#000000">BITFURY TECH INVESTMENT LIMITED</text>

  <!-- Incorporation Act Details -->
  <text x="400" y="580" font-family="'Times New Roman', Georgia, serif" font-size="16.5" text-anchor="middle" fill="#000000">is this day incorporated under the Companies Act 2006 as a private</text>
  <text x="400" y="604" font-family="'Times New Roman', Georgia, serif" font-size="16.5" text-anchor="middle" fill="#000000">company, that the company is limited by shares, and the situation of its</text>
  <text x="400" y="628" font-family="'Times New Roman', Georgia, serif" font-size="16.5" text-anchor="middle" fill="#000000">registered office is in England and Wales</text>

  <!-- Date Given -->
  <text x="400" y="684" font-family="'Times New Roman', Georgia, serif" font-size="17.5" text-anchor="middle" fill="#000000">Given at Companies House, Cardiff, on <tspan font-weight="bold">3rd February 2019</tspan></text>

  <!-- Barcode (Crisp Code128 pattern matching screenshot) -->
  <g transform="translate(140, 770)">
    <rect x="0" y="0" width="4" height="46" fill="#000"/>
    <rect x="6" y="0" width="2" height="46" fill="#000"/>
    <rect x="11" y="0" width="6" height="46" fill="#000"/>
